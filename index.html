<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de Campo - Agrícola Huarmey</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="image_0.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a10f13;
            --primary-hover: #c9141a;
            --bg-body: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --radius: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 24px;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header img.logo {
            width: 80px;
            height: auto;
            margin-bottom: 12px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input[type="date"],
        input[type="time"],
        input[type="number"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fafafa;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(161, 15, 19, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            grid-column: span 2;
            background-color: var(--primary);
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        #log {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .success { background-color: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
        .error { background-color: #fff5f5; color: #9b2c2c; border: 1px solid #fed7d7; }
        .pending { background-color: #fefcbf; color: #744210; border: 1px solid #faf089; }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .btn-submit {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="ICO FRUSAN.png" alt="Logo Agrícola Huarmey" class="logo">
            <h1>Registro de Incidencias Cosecha Arándanos 2026</h1>
        </header>

        <form id="incidenciaForm" class="form-grid">
            <div class="form-group full-width">
                <label for="fecha_incidencia">Fecha de Incidencia:</label>
                <input type="date" id="fecha_incidencia" name="fecha_incidencia" required>
            </div>

            <!-- Campos calculados automáticos -->
            <input type="hidden" id="dia" name="dia">
            <input type="hidden" id="semana" name="semana">

            <div class="form-group full-width">
                <label for="responsable_registro">Responsable del Registro:</label>
                <select id="responsable_registro" name="responsable_registro" required>
                    <option value="">Seleccione un responsable</option>
                    <option value="RIVALDO VALLES">RIVALDO VALLES</option>
                    <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hora_inicio">Hora Inicio:</label>
                <input type="time" id="hora_inicio" name="hora_inicio" required>
            </div>

            <div class="form-group">
                <label for="hora_fin">Hora Fin:</label>
                <input type="time" id="hora_fin" name="hora_fin" required>
            </div>

            <div class="form-group">
                <label for="personas">Personas Afectadas:</label>
                <input type="number" id="personas" name="personas" required>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Incidencia:</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Seleccione tipo</option>
                    <option value="CLIMA">CLIMA</option>
                    <option value="PRODUCCION">PRODUCCION</option>
                    <option value="TRANSPORTE">TRANSPORTE</option>
                    <option value="SSOMA">SSOMA</option>
                    <option value="COMEDORES">COMEDORES</option>
                    <option value="HERRAMIENTAS COSECHA">HERRAMIENTAS COSECHA</option>
                    <option value="ALIMENTACIÓN">ALIMENTACIÓN</option>
                    <option value="PAGOS">PAGOS</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="descripcion_problema">Descripción del Problema:</label>
                <textarea id="descripcion_problema" name="descripcion_problema" required></textarea>
            </div>

            <div class="form-group full-width">
                <label for="accion_tomada">Acción Tomada:</label>
                <textarea id="accion_tomada" name="accion_tomada" required></textarea>
            </div>

            <div class="form-group full-width">
                <label for="variedad">Variedad:</label>
                <select id="variedad" name="variedad" required>
                    <option value="">Seleccione Variedad</option>
                    <option value="MAGICA 2024">MAGICA 2024</option>
                    <option value="MAGICA 2025">MAGICA 2025</option>
                    <option value="MEGA EARLY 2026">MEGA EARLY 2026</option>
                    <option value="IQBERRY 2025">IQBERRY 2025</option>

                </select>
            </div>

            <div class="form-group">
                <label for="modulo_turno">Módulo-Turno:</label>
                <select id="modulo_turno" name="modulo_turno" required>
                    <option value="">Seleccione Módulo-Turno</option>
                </select>
            </div>

            <div class="form-group">
                <label for="responsable">Responsable (Área):</label>
                <select id="responsable" name="responsable" required>
                    <option value="">Seleccione área</option>
                    <option value="Recursos Humanos (RRHH)">Recursos Humanos (RRHH)</option>
                    <option value="Seguridad y Salud (SST)">Seguridad y Salud (SST)</option>
                    <option value="Operaciones / Campo">Operaciones / Campo</option>
                    <option value="Riego e Infraestructura">Riego e Infraestructura</option>
                    <option value="Logística">Logística</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Registrar Incidencia</button>
        </form>

        <div id="log"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.0/dist/dexie.min.js"></script>
    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-6CirM6r-YQgGu0u_MU4chULnRyBH70OVZaMYbLLRMUbt04zkW_PGRc5TyBjUxxId/exec";

        // Cargar las opciones de Módulo-Turno
        const moduloSelect = document.getElementById('modulo_turno');
        for (let m = 1; m <= 9; m++) {
            for (let t = 1; t <= 5; t++) {
                const opt = document.createElement('option');
                opt.value = `Módulo ${m}-Turno ${t}`;
                opt.textContent = `Módulo ${m}-Turno ${t}`;
                moduloSelect.appendChild(opt);
            }
        }

        const db = new Dexie('BitacorasHuarmeyDB');
        db.version(1).stores({
            incidencias: '++id,fecha_incidencia,status'
        });

        const form = document.getElementById('incidenciaForm');
        const log = document.getElementById('log');

        function showLog(message, type) {
            log.textContent = message;
            log.className = type;
            log.style.display = 'block';
            setTimeout(() => { log.style.display = 'none'; }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const incidencia = Object.fromEntries(formData.entries());
            
            incidencia.dia = getDiaSemana(incidencia.fecha_incidencia);
            incidencia.semana = getSemanaDelAño(incidencia.fecha_incidencia);
            incidencia.status = 'Pendiente';

            try {
                const id = await db.incidencias.add(incidencia);
                incidencia.id = id;
                
                if (navigator.onLine) {
                    await sincronizarIncidencia(incidencia);
                } else {
                    showLog('Guardado localmente. Se enviará automáticamente al recuperar internet.', 'pending');
                }

            } catch (error) {
                showLog('Error al guardar localmente: ' + error.message, 'error');
            } finally {
                form.reset();
            }
        });

        async function sincronizarIncidencia(incidencia) {
            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(incidencia)
                });

                await db.incidencias.update(incidencia.id, { status: 'Sincronizado' });
                showLog('Registro guardado correctamente en Google Sheets.', 'success');

            } catch (error) {
                await db.incidencias.update(incidencia.id, { status: 'Error' });
                showLog('Sin conexión. La incidencia se enviará automáticamente al estar en línea.', 'error');
            }
        }

        async function sincronizarPendientes() {
            if (!navigator.onLine) return;

            try {
                const pendientes = await db.incidencias.where('status').anyOf('Pendiente', 'Error').toArray();
                if (pendientes.length === 0) return;

                for (const incidencia of pendientes) {
                    await sincronizarIncidencia(incidencia);
                }
            } catch (error) {
                console.error('Error durante sincronización background:', error);
            }
        }

        window.addEventListener('online', sincronizarPendientes);
        sincronizarPendientes();

        function getDiaSemana(fechaStr) {
            if (!fechaStr) return "";
            const dateParts = fechaStr.split("-");
            const fecha = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
            const dias = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];
            return dias[fecha.getDay()];
        }

        function getSemanaDelAño(fechaStr) {
            if (!fechaStr) return "";
            const dateParts = fechaStr.split("-");
            const fecha = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
            const d = new Date(Date.UTC(fecha.getFullYear(), fecha.getMonth(), fecha.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('SW activo'))
                .catch(err => console.error('Error SW:', err));
        }
    </script>
</body>
</html>
