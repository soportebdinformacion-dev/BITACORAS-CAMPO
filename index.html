<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Huarmey - Registro de Incidencias</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B3261E">
  <style>
    :root {
      --rojo-agricola: #B3261E;
      --rojo-oscuro: #8C1D18;
      --verde-hoja: #388E3C;
      --blanco: #FFFFFF;
      --gris-claro: #F4F6F8;
      --gris-borde: #CFD8DC;
      --texto-primario: #263238;
      --sombra: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--gris-claro);
      color: var(--texto-primario);
      padding-bottom: 30px;
    }

    header {
      background-color: var(--rojo-agricola);
      color: var(--blanco);
      padding: 15px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: var(--sombra);
    }

    header img {
      height: 45px;
      width: auto;
      background: white;
      border-radius: 50%;
      padding: 2px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .container {
      max-width: 600px;
      margin: 15px auto;
      padding: 0 12px;
    }

    /* Estado de Conexión */
    #status-bar {
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .online {
      background-color: #E8F5E9;
      color: #2E7D32;
      border: 1px solid #A5D6A7;
    }

    .offline {
      background-color: #FFEBEE;
      color: #C62828;
      border: 1px solid #FFCDD2;
    }

    .card {
      background: var(--blanco);
      padding: 18px;
      border-radius: 12px;
      box-shadow: var(--sombra);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      color: var(--rojo-agricola);
      margin-bottom: 15px;
      border-bottom: 2px solid var(--gris-claro);
      padding-bottom: 8px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #455A64;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--gris-borde);
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #FAFAFA;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--rojo-agricola);
      background-color: var(--blanco);
    }

    input[readonly] {
      background-color: #ECEFF1;
      color: #546E7A;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--rojo-agricola);
      color: var(--blanco);
      box-shadow: 0 3px 6px rgba(179, 38, 30, 0.3);
    }

    .btn-primary:active {
      background-color: var(--rojo-oscuro);
    }

    .btn-sync {
      background-color: var(--verde-hoja);
      color: var(--blanco);
      margin-top: 10px;
    }

    /* Tabla de registros guardados */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--gris-borde);
    }

    th {
      background-color: #F0F4F8;
      color: var(--texto-primario);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      display: inline-block;
      text-align: center;
    }

    .badge-pendiente { background-color: #FFF3E0; color: #E65100; }
    .badge-sincronizado { background-color: #E8F5E9; color: #1B5E20; }
    .badge-error { background-color: #FFEBEE; color: #B71C1C; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Logo Agrícola Huarmey" id="app-logo">
    <h1>Agrícola Huarmey<br><small style="font-size: 0.75rem; font-weight: normal;">Incidencias en Campo</small></h1>
  </header>

  <div class="container">
    <!-- Indicador Estado de Conexión -->
    <div id="status-bar" class="online">🌐 Modo Online - Conectado</div>

    <!-- Formulario de Entrada -->
    <form id="incidencia-form" class="card">
      <div class="card-title">📝 Nuevo Registro de Incidencia</div>

      <div class="form-group">
        <label for="fecha_incidencia">FECHA INCIDENCIA *</label>
        <input type="date" id="fecha_incidencia" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="dia">DÍA</label>
          <input type="text" id="dia" readonly placeholder="AUTO">
        </div>
        <div class="form-group">
          <label for="semana">SEMANA</label>
          <input type="text" id="semana" readonly placeholder="AUTO">
        </div>
      </div>

      <div class="form-group">
        <label for="responsable_registro">RESPONSABLE REGISTRO *</label>
        <select id="responsable_registro" required>
          <option value="">Seleccione...</option>
          <option value="RIVALDO VALLES">RIVALDO VALLES</option>
          <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="hora_inicio">HORA INICIO *</label>
          <input type="time" id="hora_inicio" required>
        </div>
        <div class="form-group">
          <label for="hora_fin">HORA FIN *</label>
          <input type="time" id="hora_fin" required>
        </div>
      </div>

      <div class="form-group">
        <label for="personas">PERSONAS (Nº) *</label>
        <input type="number" id="personas" min="1" step="1" required placeholder="Cantidad de personal">
      </div>

      <div class="form-group">
        <label for="tipo">TIPO *</label>
        <select id="tipo" required>
          <option value="">Seleccione...</option>
          <option value="CLIMA">CLIMA</option>
          <option value="PRODUCCION">PRODUCCION</option>
          <option value="TRANSPORTE">TRANSPORTE</option>
          <option value="SSOMA">SSOMA</option>
          <option value="COMEDORES">COMEDORES</option>
          <option value="HERRAMIENTAS COSECHA">HERRAMIENTAS COSECHA</option>
          <option value="ALIMENTACIÓN">ALIMENTACIÓN</option>
          <option value="PAGOS">PAGOS</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descripcion_problema">DESCRIPCIÓN DEL PROBLEMA *</label>
        <textarea id="descripcion_problema" rows="3" required placeholder="Detalle la incidencia acontecida..."></textarea>
      </div>

      <div class="form-group">
        <label for="accion_tomada">ACCIÓN TOMADA *</label>
        <textarea id="accion_tomada" rows="3" required placeholder="Describa la solución o medidas aplicadas..."></textarea>
      </div>

      <div class="form-group">
        <label for="variedad">VARIEDAD *</label>
        <select id="variedad" required>
          <option value="">Seleccione...</option>
          <option value="MAGICA 2024">MAGICA 2024</option>
          <option value="MAGICA 2025">MAGICA 2025</option>
          <option value="MEGA EARLY 2026">MEGA EARLY 2026</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modulo_turno">MÓDULO - TURNO *</label>
        <select id="modulo_turno" required>
          <option value="">Seleccione...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="responsable">RESPONSABLE ÁREA *</label>
        <select id="responsable" required>
          <option value="">Seleccione...</option>
          <option value="Recursos Humanos (RRHH)">Recursos Humanos (RRHH)</option>
          <option value="Seguridad y Salud (SST)">Seguridad y Salud (SST)</option>
          <option value="Operaciones / Campo">Operaciones / Campo</option>
          <option value="Riego e Infraestructura">Riego e Infraestructura</option>
          <option value="Logística">Logística</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">💾 Registrar Incidencia</button>
    </form>

    <!-- Panel de Registros Guardados / Sincronización -->
    <div class="card">
      <div class="card-title">📋 Bitácora Local</div>
      <button id="btn-force-sync" class="btn btn-sync">🔄 Sincronizar Pendientes</button>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Resp.</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-registros">
            <!-- Registros dinámicos -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // URL DE GOOGLE APPS SCRIPT (Reemplazar con la URL obtenida tras el despliegue)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzokhYSW-4sDW8tqPzZ2-J9CCKeWZFI2uk9duXZtzH5DnXcC2l8vLcsGmuulNbYwv5w/exec";

    // --- Cargar Opciones de Módulo - Turno Dinámicamente ---
    const selectModuloTurno = document.getElementById('modulo_turno');
    for (let m = 1; m <= 9; m++) {
      for (let t = 1; t <= 5; t++) {
        const option = document.createElement('option');
        const val = `Módulo ${m}-Turno ${t}`;
        option.value = val;
        option.textContent = val;
        selectModuloTurno.appendChild(option);
      }
    }

    // --- Base de Datos IndexedDB ---
    let db;
    const request = indexedDB.open('AgricolaHuarmeyDB', 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('incidencias')) {
        const store = db.createObjectStore('incidencias', { keyPath: 'id', autoIncrement: true });
        store.createIndex('estado', 'estado', { unique: false });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      cargarTablaRegistros();
      checkNetworkAndSync();
    };

    request.onerror = (e) => console.error("Error IndexedDB:", e);

    // --- Manejo de Fechas Automáticas ---
    document.getElementById('fecha_incidencia').addEventListener('change', function() {
      const fechaVal = this.value;
      if (!fechaVal) return;

      const fecha = new Date(fechaVal + 'T00:00:00');
      
      // Día de la semana en mayúsculas
      const dias = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
      document.getElementById('dia').value = dias[fecha.getDay()];

      // Cálculo de Número de Semana ISO
      const target = new Date(fecha.valueOf());
      const dayNr = (fecha.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
      }
      const weekNumber = 1 + Math.round((firstThursday - target.valueOf()) / 604800000);
      document.getElementById('semana').value = `SEMANA - ${weekNumber}`;
    });

    // --- Detección de Red ---
    const statusBar = document.getElementById('status-bar');
    function updateOnlineStatus() {
      if (navigator.onLine) {
        statusBar.className = 'online';
        statusBar.textContent = '🌐 Modo Online - Conectado';
        checkNetworkAndSync();
      } else {
        statusBar.className = 'offline';
        statusBar.textContent = '⚠️ Modo Offline - Trabajando localmente';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // --- Envío del Formulario ---
    document.getElementById('incidencia-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const registro = {
        fecha_incidencia: document.getElementById('fecha_incidencia').value,
        dia: document.getElementById('dia').value,
        semana: document.getElementById('semana').value,
        responsable_registro: document.getElementById('responsable_registro').value,
        hora_inicio: document.getElementById('hora_inicio').value,
        hora_fin: document.getElementById('hora_fin').value,
        personas: parseInt(document.getElementById('personas').value, 10),
        tipo: document.getElementById('tipo').value,
        descripcion_problema: document.getElementById('descripcion_problema').value,
        accion_tomada: document.getElementById('accion_tomada').value,
        variedad: document.getElementById('variedad').value,
        modulo_turno: document.getElementById('modulo_turno').value,
        responsable: document.getElementById('responsable').value,
        estado: 'Pendiente',
        fecha_creacion: new Date().toISOString()
      };

      const tx = db.transaction(['incidencias'], 'readwrite');
      const store = tx.objectStore('incidencias');
      store.add(registro);

      tx.oncomplete = () => {
        alert('✅ Registro guardado localmente');
        document.getElementById('incidencia-form').reset();
        cargarTablaRegistros();
        if (navigator.onLine) checkNetworkAndSync();
      };
    });

    // --- Cargar Tabla en la Interfaz ---
    function cargarTablaRegistros() {
      const tbody = document.getElementById('tabla-registros');
      tbody.innerHTML = '';

      const tx = db.transaction(['incidencias'], 'readonly');
      const store = tx.objectStore('incidencias');
      const req = store.openCursor(null, 'prev');

      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const item = cursor.value;
          const tr = document.createElement('tr');
          
          let classBadge = 'badge-pendiente';
          if (item.estado === 'Sincronizado') classBadge = 'badge-sincronizado';
          if (item.estado === 'Error') classBadge = 'badge-error';

          tr.innerHTML = `
            <td>${item.fecha_incidencia}</td>
            <td>${item.tipo}</td>
            <td>${item.responsable_registro}</td>
            <td><span class="badge ${classBadge}">${item.estado}</span></td>
          `;
          tbody.appendChild(tr);
          cursor.continue();
        }
      };
    }

    // --- Motor de Sincronización con Google Sheets ---
    async function checkNetworkAndSync() {
      if (!navigator.onLine) return;

      const tx = db.transaction(['incidencias'], 'readonly');
      const store = tx.objectStore('incidencias');
      const req = store.getAll();

      req.onsuccess = async () => {
        const registros = req.result;
        const pendientes = registros.filter(r => r.estado === 'Pendiente' || r.estado === 'Error');

        for (let item of pendientes) {
          try {
            const respuesta = await fetch(APPS_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors', // Soporte para Google Apps Script Web App
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(item)
            });

            // Al usar no-cors asumimos la entrega si no arroja excepción de red
            actualizarEstadoRegistro(item.id, 'Sincronizado');
          } catch (err) {
            console.error("Error sincronizando:", err);
            actualizarEstadoRegistro(item.id, 'Error');
          }
        }
      };
    }

    function actualizarEstadoRegistro(id, nuevoEstado) {
      const tx = db.transaction(['incidencias'], 'readwrite');
      const store = tx.objectStore('incidencias');
      const req = store.get(id);

      req.onsuccess = () => {
        const data = req.result;
        if (data) {
          data.estado = nuevoEstado;
          store.put(data);
        }
      };

      tx.oncomplete = () => {
        cargarTablaRegistros();
      };
    }

    document.getElementById('btn-force-sync').addEventListener('click', checkNetworkAndSync);

    // --- Registro del Service Worker ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service Worker Registrado'))
        .catch(err => console.error('Error al registrar SW:', err));
    }
  </script>
</body>
</html>
